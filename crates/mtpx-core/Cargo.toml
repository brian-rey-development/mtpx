[package]
name = "mtpx-core"
version = "0.1.0"
description = "Incremental MTP transfer engine: plan, transfer, sync and resume files on Android devices"
keywords = ["mtp", "android", "sync", "usb", "transfer"]
categories = ["filesystem", "hardware-support"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[features]
virtual-device = ["mtp-rs/virtual-device"]

[dependencies]
mtp-rs = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "time"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
filetime = { workspace = true }
jiff = { workspace = true }
walkdir = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true
