[package]
name = "mtpx"
version.workspace = true
description = "rsync for your phone: fast, incremental file transfers over MTP, in pure Rust"
keywords = ["mtp", "android", "sync", "cli", "rsync"]
categories = ["command-line-utilities", "filesystem"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[features]
virtual-device = ["mtpx-core/virtual-device"]

[dependencies]
mtpx-core = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
indicatif = { workspace = true }
console = { workspace = true }
dialoguer = { workspace = true }
miette = { workspace = true, features = ["fancy-no-backtrace"] }
humansize = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "cli"
path = "tests/cli/main.rs"
required-features = ["virtual-device"]
